global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cloud-dashboard'
    environment: 'production'

# Alertmanager configuration (optional, for future use)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape OTel Collector metrics endpoint
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 10s

  # Scrape OTel Collector Prometheus exporter
  - job_name: 'otel-exporter'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s

  # Scrape application metrics (if exposed directly)
  - job_name: 'cloud-dashboard'
    static_configs:
      - targets: ['app:8501']
    scrape_interval: 30s
    metrics_path: '/metrics'
    # Honor labels from the application
    honor_labels: true

  # Scrape PostgreSQL metrics (requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Scrape MinIO metrics
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['minio:9000']

# Remote write configuration (for long-term storage)
# remote_write:
#   - url: "http://victoriametrics:8428/api/v1/write"

# Remote read configuration
# remote_read:
#   - url: "http://victoriametrics:8428/api/v1/read"
